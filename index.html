<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Life Plan</title>
<meta name="theme-color" content="#0E1116">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Life Plan">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  --bg:#0E1116; --surface:#151A21; --card:#1B222B; --line:#28313C; --text:#E8ECF1; --muted:#8A96A3; --faint:#5B6672;
  --accent:#7C9CFF; --high:#F07167; --warn:#F2B84B; --ok:#3FC1A5; --r:14px;
  --c-comicstracker:#F2B84B; --c-mccinventory:#3FC1A5; --c-tvworld:#A78BFA; --c-financialplanner:#4FB0E8; --c-chorewheel:#E58FD0; --c-other:#9AA5AB;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif}
button,input{font:inherit;color:inherit} button{cursor:pointer}
a{color:inherit;text-decoration:none}
.wrap{max-width:680px;margin:0 auto;padding:0 16px calc(40px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:10;background:rgba(14,17,22,.93);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
header .wrap{padding-top:12px;padding-bottom:10px;display:flex;align-items:center;gap:10px}
.logo{font-weight:760;font-size:20px;letter-spacing:-.01em}.logo b{color:var(--accent)}
.date{font-size:12.5px;color:var(--muted)}
.grow{flex:1}
.iconbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.iconbtn svg{width:18px;height:18px}
.iconbtn.spin svg{animation:spin 1s linear infinite} @keyframes spin{to{transform:rotate(360deg)}}
.headline{margin:18px 2px 4px;font-size:21px;font-weight:700;line-height:1.3}
.headline small{display:block;font-size:13px;color:var(--muted);font-weight:500;margin-top:4px}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;margin-top:14px}
.seg button{flex:1;border:none;background:none;border-radius:9px;padding:9px 4px;font-size:13.5px;color:var(--muted);font-weight:560}
.seg button.on{background:var(--card);color:var(--text)}
.seg .n{display:inline-block;min-width:20px;padding:0 6px;border-radius:999px;background:var(--line);font-size:11.5px;margin-left:4px}
.seg .n.hi{background:var(--high);color:#2A0E0B}
.chips{display:flex;gap:6px;overflow-x:auto;padding:12px 0 2px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:none;border-radius:999px;padding:5px 11px;font-size:12.5px;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:6px}
.chip.on{color:var(--text);border-color:var(--faint);background:var(--surface)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.day{font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin:20px 4px 8px;display:flex;gap:8px;align-items:center}
.day.hi{color:var(--high)}
.item{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:11px 12px;margin-bottom:7px}
.item.high{border-color:rgba(240,113,103,.4)}
.ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none;font-size:17px;background:var(--card)}
.body{flex:1;min-width:0}
.label{font-weight:560;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.meta{font-size:12px;color:var(--muted);margin-top:2px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.badge{font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--high);border:1px solid rgba(240,113,103,.45);border-radius:6px;padding:0 5px}
.go{color:var(--faint);font-size:18px}
.empty{color:var(--muted);text-align:center;padding:36px 10px}
.more{display:block;width:100%;background:none;border:1px dashed var(--line);color:var(--muted);border-radius:12px;padding:9px;margin-top:4px;font-size:13px}
.sources{margin-top:26px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:6px 12px}
.sources h3{font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin:10px 0 4px}
.src{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:13.5px}
.src:first-of-type{border-top:none}
.src .st{margin-left:auto;font-size:12px;color:var(--muted);text-align:right}
.src .st.err{color:var(--high)} .src .st.stale{color:var(--warn)}
.src a.open{color:var(--accent);font-size:12px}
.foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:9px 14px;font-size:13.5px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#0B1330;font-weight:650}
.hint{font-size:12px;color:var(--faint)}
#auth{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
#auth .box{max-width:360px;width:100%;text-align:center}
#auth h1{margin:8px 0 6px;font-size:30px}#auth h1 b{color:var(--accent)}
#auth p{color:var(--muted);margin:0 0 20px}
#auth .btn{width:100%}
.hidden{display:none!important}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#232C37;border:1px solid var(--line);padding:9px 14px;border-radius:12px;font-size:13.5px;opacity:0;transition:.2s;pointer-events:none;z-index:50;max-width:calc(100vw - 32px)}
.toast.show{opacity:1}
</style>
</head>
<body>

<div id="auth">
  <div class="box">
    <img src="icons/icon-192.png" alt="" width="72" height="72" style="border-radius:18px">
    <h1>Life <b>Plan</b></h1>
    <p>Everything that's due across your apps, in one place. Read-only.</p>
    <button class="btn primary" id="signin" onclick="signIn()" disabled style="opacity:.6">Loading…</button>
    <p style="margin-top:16px"><a href="#" onclick="event.preventDefault();redirectSignIn()" class="hint" style="text-decoration:underline">Sign-in window not opening? Try another way</a></p>
    <p id="auth-msg" class="hint"></p>
  </div>
</div>

<header><div class="wrap">
  <div><div class="logo">Life <b>Plan</b></div><div class="date" id="date"></div></div>
  <div class="grow"></div>
  <button class="iconbtn" id="refresh" onclick="refresh(true)" aria-label="Refresh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4L21 8"/><path d="M21 3v5h-5"/></svg></button>
</div></header>

<main class="wrap" id="main"></main>
<div class="toast" id="toast"></div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://apis.google.com/js/api.js" async defer></script>
<script>
/* =============== CONFIG =============== */
const CLIENT_ID = '669494100250-gvromuq72r7j0djmkd4vdbdq5damncj7.apps.googleusercontent.com';
const SCOPE_FILE = 'https://www.googleapis.com/auth/drive.file';
const SCOPE_RO = 'https://www.googleapis.com/auth/drive.readonly';
const PICKER_API_KEY = 'AIzaSyAHadhdBv8qOsaD91L6l4V74AF38LZVCFY';
const GCP_APP_ID = '669494100250';
const API = 'https://www.googleapis.com/drive/v3/files';
const DEMO = new URLSearchParams(location.search).has('demo');
// Add a line here to bring another app onto the dashboard.
const SOURCES = [
  { app: 'tvworld',           name: 'TV World',          file: 'tvworld-data.json',          url: 'https://marvyeo.github.io/TVWorld/' },
  { app: 'financialplanner',  name: 'Financial Planner', file: 'financialplanner-data.json', url: 'https://marvyeo.github.io/FinancialPlanner/' },
  { app: 'chorewheel',        name: 'ChoreWheel',        file: 'chorewheel-data.json',       url: 'https://marvyeo.github.io/ChoreWheel/' },
  { app: 'comicstracker',     name: 'ComicsTracker',     file: 'comicstracker-data.json',    url: 'https://marvyeo.github.io/ComicsTracker/' },
  { app: 'mccinventory',      name: 'MCC Inventory',     file: 'mcc-inventory-items.json',   url: 'https://marvyeo.github.io/MCC-Inventory/' },
];
const TYPES = {
  episode: ['📺', 'Episode'], release: ['🎬', 'Release'], 'bill-due': ['💳', 'Bill'], bill: ['💳', 'Bill'],
  'cap-alert': ['📊', 'Card cap'], 'rules-update': ['📋', 'Card rules'], chore: ['🧽', 'Chore'], 'low-stock': ['📦', 'Low stock'],
  'due-date': ['⏰', 'Due'], trip: ['✈️', 'Trip'], 'game-launch': ['🎮', 'Game'], concert: ['🎤', 'Concert'],
};
const ACTION_TYPES = new Set(['bill-due', 'bill', 'due-date', 'chore', 'low-stock', 'cap-alert', 'rules-update']);
const STALE_DAYS = 7;
const LS = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} }, del: k => { try { localStorage.removeItem(k); } catch (e) {} } };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* =============== DATES =============== */
const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const parse = s => { const [y, m, d] = s.slice(0, 10).split('-').map(Number); return new Date(y, m - 1, d); };
const today = () => iso(new Date());
const plus = (n) => { const d = new Date(); d.setDate(d.getDate() + n); return iso(d); };
const daysAgo = ms => Math.floor((Date.now() - ms) / 86400000);
function dayTitle(s) {
  const t = today();
  if (s === t) return 'Today';
  if (s === plus(1)) return 'Tomorrow';
  return parse(s).toLocaleDateString('en-SG', { weekday: 'long', day: 'numeric', month: 'short' });
}

/* =============== STATE =============== */
let state = { items: [], sources: {}, at: null };   // sources[app] = {status, modified, count, error}
let VIEW = LS.get('lp-view') || 'week';
let APPS = new Set(JSON.parse(LS.get('lp-apps') || 'null') || SOURCES.map(s => s.app));
let SHOW_ALL_LATER = false;

/* =============== BUCKETS =============== */
function classify(items) {
  const t = today(), w = plus(7), m = plus(30);
  const attention = [], week = [], month = [];
  for (const it of items) {
    if (!APPS.has(it.app)) continue;
    const d = (it.date || '').slice(0, 10);
    if (!/^\d{4}-\d\d-\d\d$/.test(d)) continue;
    if (d < t) { if (it.priority === 'high' || ACTION_TYPES.has(it.type)) attention.push(it); continue; }  // stale episodes/releases drop off
    if (d === t && it.priority === 'high' && ACTION_TYPES.has(it.type)) { attention.push(it); continue; }   // overdue chores, low stock (dated today)
    if (d <= w) week.push(it);
    if (d <= m) month.push(it);
  }
  const by = (a, b) => a.date.localeCompare(b.date) || (b.priority === 'high') - (a.priority === 'high') || a.label.localeCompare(b.label);
  return { attention: attention.sort(by), week: week.sort(by), month: month.sort(by) };
}
function summaryLine(list) {
  const counts = {};
  list.forEach(i => { const k = (TYPES[i.type] || [null, 'item'])[1]; counts[k] = (counts[k] || 0) + 1; });
  const plural = (n, w) => `${n} ${w.toLowerCase()}${n !== 1 ? (w.endsWith('s') ? '' : 's') : ''}`;
  const parts = Object.entries(counts).sort((a, b) => b[1] - a[1]).map(([k, n]) => plural(n, k));
  if (!parts.length) return 'Nothing due';
  return parts.length > 1 ? parts.slice(0, -1).join(', ') + ' and ' + parts.at(-1) : parts[0];
}

/* =============== RENDER =============== */
function itemRow(it) {
  const icon = it.app === 'comicstracker' && it.type === 'release' ? '📚' : (TYPES[it.type] || ['•'])[0];
  const src = SOURCES.find(s => s.app === it.app);
  const color = `var(--c-${src ? it.app : 'other'})`;
  const url = it.url || src?.url || '#';
  const late = it.date < today();
  return `<a class="item ${it.priority === 'high' ? 'high' : ''}" href="${esc(url)}" target="_blank" rel="noopener">
    <div class="ico" style="box-shadow:inset 0 0 0 1px ${color}">${icon}</div>
    <div class="body"><div class="label">${esc(it.label)}</div>
      <div class="meta"><span class="dot" style="background:${color}"></span>${esc(src?.name || it.app || 'Other')}${late ? ` · since ${parse(it.date).toLocaleDateString('en-SG', { day: 'numeric', month: 'short' })}` : ''}${it.priority === 'high' ? ' <span class="badge">High</span>' : ''}</div></div>
    <span class="go">›</span></a>`;
}
function grouped(list, limit) {
  let h = '', last = '', shown = 0;
  for (const it of list) {
    if (limit && shown >= limit) break;
    if (it.date !== last) { last = it.date; h += `<div class="day">${dayTitle(it.date)}</div>`; }
    h += itemRow(it); shown++;
  }
  if (limit && list.length > limit) h += `<button class="more" onclick="SHOW_ALL_LATER=true;render()">Show ${list.length - limit} more</button>`;
  return h;
}
function render() {
  document.getElementById('date').textContent = new Date().toLocaleDateString('en-SG', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  const { attention, week, month } = classify(state.items);
  const list = VIEW === 'attention' ? attention : VIEW === 'week' ? week : month;
  const head = VIEW === 'attention' ? 'Needs attention' : VIEW === 'week' ? 'Next 7 days' : 'Next 30 days';
  let h = `<div class="headline">${head}: ${summaryLine(list)}${attention.length && VIEW !== 'attention' ? `<small>⚠️ ${attention.length} item${attention.length !== 1 ? 's' : ''} need${attention.length === 1 ? 's' : ''} attention</small>` : ''}</div>`;
  h += `<div class="seg">
    <button class="${VIEW === 'attention' ? 'on' : ''}" onclick="setView('attention')">Attention<span class="n ${attention.length ? 'hi' : ''}">${attention.length}</span></button>
    <button class="${VIEW === 'week' ? 'on' : ''}" onclick="setView('week')">7 days<span class="n">${week.length}</span></button>
    <button class="${VIEW === 'month' ? 'on' : ''}" onclick="setView('month')">30 days<span class="n">${month.length}</span></button></div>`;
  h += `<div class="chips">${SOURCES.map(s => `<button class="chip ${APPS.has(s.app) ? 'on' : ''}" onclick="toggleApp('${s.app}')"><span class="dot" style="background:var(--c-${s.app})"></span>${esc(s.name)}</button>`).join('')}</div>`;
  if (!state.at) h += `<div class="empty">Loading…</div>`;
  else if (!list.length) h += `<div class="empty">${VIEW === 'attention' ? '✓ Nothing overdue.' : '🎉 Nothing due in this window.'}</div>`;
  else if (VIEW === 'attention') { h += '<div class="day hi">Overdue or needs action</div>' + list.map(itemRow).join(''); }
  else h += grouped(list, VIEW === 'month' && !SHOW_ALL_LATER ? 60 : 0);
  h += renderSources();
  document.getElementById('main').innerHTML = h;
}
function renderSources() {
  const rows = SOURCES.map(s => {
    const st = state.sources[s.app] || { status: 'loading' };
    let txt = '…', cls = '';
    if (st.status === 'ok') {
      const age = daysAgo(st.modified);
      txt = `${st.count} item${st.count !== 1 ? 's' : ''} · saved ${age === 0 ? 'today' : age === 1 ? 'yesterday' : age + ' days ago'}`;
      if (age > STALE_DAYS) { cls = 'stale'; txt += ` · stale, <a class="open" href="${s.url}" target="_blank" rel="noopener">open to refresh</a>`; }
    } else if (st.status === 'missing') { cls = 'err'; txt = 'File not found'; }
    else if (st.status === 'error') { cls = 'err'; txt = esc(st.error || 'Error'); }
    return `<div class="src"><span class="dot" style="background:var(--c-${s.app})"></span><a href="${s.url}" target="_blank" rel="noopener">${esc(s.name)}</a><span class="st ${cls}">${txt}</span></div>`;
  }).join('');
  const missing = SOURCES.filter(s => state.sources[s.app]?.status === 'missing');
  return `<div class="sources"><h3>Sources</h3>${rows}</div>
    ${missing.length ? `<p class="hint" style="margin-top:10px">Some files weren't visible to Life Plan. Pick them once (this device remembers), or grant read-only access to your whole Drive.</p>
      <div class="foot"><button class="btn" onclick="pickMissing()">Pick missing files</button><button class="btn" onclick="grantWider()">Grant read-only access</button></div>` : ''}
    <div class="foot">${DEMO ? '' : '<button class="btn" onclick="signOut()">Sign out</button>'}<span class="hint" style="align-self:center">${state.at ? 'Updated ' + new Date(state.at).toLocaleTimeString('en-SG', { hour: 'numeric', minute: '2-digit' }) : ''} · Life Plan never changes your apps' data.</span></div>`;
}
function setView(v) { VIEW = v; SHOW_ALL_LATER = false; LS.set('lp-view', v); render(); }
function toggleApp(a) { APPS.has(a) ? APPS.delete(a) : APPS.add(a); if (!APPS.size) SOURCES.forEach(s => APPS.add(s.app)); LS.set('lp-apps', JSON.stringify([...APPS])); render(); }
function toast(m) { const t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2600); }

/* =============== AUTH =============== */
let tokenClient, accessToken = null, scope = LS.get('lp-scope') || SCOPE_FILE;
const savedTok = () => { try { return JSON.parse(LS.get('lp-token') || 'null'); } catch (e) { return null; } };
function keepToken(t, expiresIn, sc) {
  accessToken = t; if (sc) { scope = sc; LS.set('lp-scope', sc); }
  LS.set('lp-token', JSON.stringify({ t, exp: Date.now() + (Number(expiresIn) || 3599) * 1000, email: (savedTok() || {}).email || '' }));
}
function initAuth() {
  if (DEMO) { loadDemo(); return; }
  if (consumeRedirect()) return;
  const tok = savedTok();
  if (tok && tok.t && tok.exp > Date.now() + 60000) { accessToken = tok.t; start(); }
  waitForGsi();
}
function waitForGsi() {
  if (typeof google === 'undefined' || !google.accounts) { setTimeout(waitForGsi, 120); return; }
  makeClient(scope);
  if (!accessToken) authScreen('');
}
function makeClient(sc) {
  tokenClient = google.accounts.oauth2.initTokenClient({ client_id: CLIENT_ID, scope: sc, callback: r => {
    if (r.error) { authScreen('Sign-in was cancelled.'); return; }
    keepToken(r.access_token, r.expires_in, sc); start();
  } });
}
function signIn() { const tok = savedTok(); document.getElementById('signin').textContent = 'Connecting…'; tokenClient.requestAccessToken(tok && tok.email ? { prompt: '', login_hint: tok.email } : { prompt: 'consent' }); }
function authScreen(msg) {
  document.getElementById('auth').classList.remove('hidden');
  const b = document.getElementById('signin'); b.disabled = false; b.style.opacity = 1;
  const tok = savedTok(); b.textContent = tok && tok.email ? 'Continue as ' + tok.email : 'Sign in with Google';
  document.getElementById('auth-msg').textContent = msg || '';
}
// Fallback for iPhone home-screen apps where the Google pop-up can't open.
// Needs https://marvyeo.github.io/LifePlan/ under "Authorized redirect URIs" on the OAuth client.
const REDIRECT_URI = location.origin + location.pathname;
function redirectSignIn() {
  const p = new URLSearchParams({ client_id: CLIENT_ID, redirect_uri: REDIRECT_URI, response_type: 'token', scope, include_granted_scopes: 'true', prompt: 'select_account', state: 'lifeplan' });
  location.href = 'https://accounts.google.com/o/oauth2/v2/auth?' + p;
}
function consumeRedirect() {
  if (!location.hash.includes('access_token=')) return false;
  const h = new URLSearchParams(location.hash.slice(1));
  history.replaceState(null, '', REDIRECT_URI);
  if (h.get('state') !== 'lifeplan' || !h.get('access_token')) return false;
  keepToken(h.get('access_token'), h.get('expires_in'), h.get('scope') && h.get('scope').includes('drive.readonly') ? SCOPE_RO : scope);
  start(); waitForGsi(); return true;
}
function signOut() { try { google.accounts.oauth2.revoke(accessToken, () => {}); } catch (e) {} ['lp-token', 'lp-scope', 'lp-ids', 'lp-cache'].forEach(LS.del); location.reload(); }
function grantWider() {
  makeClient(SCOPE_RO);
  tokenClient.requestAccessToken({ prompt: 'consent' });
}
async function gfetch(url) {
  const r = await fetch(url, { headers: { Authorization: `Bearer ${accessToken}` } });
  if (r.status === 401) { const t = savedTok(); if (t) { t.exp = 0; LS.set('lp-token', JSON.stringify(t)); } accessToken = null; authScreen('Your Google session timed out. Tap to continue.'); throw Object.assign(new Error('session'), { session: true }); }
  if (r.status === 404) throw Object.assign(new Error('not found'), { notFound: true });
  if (!r.ok) throw new Error(`Drive ${r.status}`);
  return r;
}

/* =============== LOAD =============== */
const ids = () => { try { return JSON.parse(LS.get('lp-ids') || '{}'); } catch (e) { return {}; } };
async function findFile(src) {
  const known = ids()[src.app];
  if (known) {
    try { const j = await (await gfetch(`${API}/${known}?fields=id,modifiedTime,trashed`)).json(); if (!j.trashed) return j; }
    catch (e) { if (e.session) throw e; }
  }
  const q = encodeURIComponent(`name='${src.file}' and trashed=false`);
  const j = await (await gfetch(`${API}?q=${q}&orderBy=modifiedTime desc&pageSize=10&fields=files(id,modifiedTime,ownedByMe)&includeItemsFromAllDrives=true&supportsAllDrives=true`)).json();
  return (j.files || [])[0] || null;
}
function extractUpcoming(src, body) {
  if (Array.isArray(body)) return [];               // MCC Inventory legacy raw array
  const up = Array.isArray(body?.upcoming) ? body.upcoming : [];
  return up.filter(i => i && i.label && i.date).map(i => ({ ...i, app: i.app || src.app, date: String(i.date).slice(0, 10) }));
}
async function loadSource(src) {
  try {
    const f = await findFile(src);
    if (!f) { state.sources[src.app] = { status: 'missing' }; return []; }
    const modified = Date.parse(f.modifiedTime);
    const prev = state.sources[src.app];
    if (prev && prev.status === 'ok' && prev.modified === modified && prev.fileId === f.id) {
      return (state.items || []).filter(i => i.app === src.app);   // unchanged since last check: skip the download
    }
    const body = await (await gfetch(`${API}/${f.id}?alt=media`)).json();
    const items = extractUpcoming(src, body);
    const map = ids(); map[src.app] = f.id; LS.set('lp-ids', JSON.stringify(map));
    state.sources[src.app] = { status: 'ok', modified, count: items.length, fileId: f.id };
    return items;
  } catch (e) {
    if (e.session) throw e;
    state.sources[src.app] = { status: 'error', error: e.message };
    return (state.items || []).filter(i => i.app === src.app);   // keep last good items for this app
  }
}
let loading = false;
async function refresh(manual) {
  if (!accessToken || loading) return;
  loading = true; document.getElementById('refresh').classList.add('spin');
  try {
    const results = await Promise.all(SOURCES.map(loadSource));
    state.items = results.flat(); state.at = Date.now();
    LS.set('lp-cache', JSON.stringify(state));
    render();
    if (manual) toast('Up to date');
  } catch (e) { if (!e.session) toast('Could not refresh: ' + e.message); }
  finally { loading = false; document.getElementById('refresh').classList.remove('spin'); }
}
async function start() {
  document.getElementById('auth').classList.add('hidden');
  try { const me = await (await gfetch('https://www.googleapis.com/drive/v3/about?fields=user(emailAddress)')).json(); const t = savedTok() || {}; t.email = me.user?.emailAddress || ''; LS.set('lp-token', JSON.stringify(t)); } catch (e) { if (e.session) return; }
  refresh();
}
function pickMissing() {
  const missing = SOURCES.filter(s => state.sources[s.app]?.status === 'missing');
  gapi.load('picker', () => {
    // Only JSON files; if exactly one is missing, pre-search its name
    const view = new google.picker.DocsView(google.picker.ViewId.DOCS).setMode(google.picker.DocsViewMode.LIST).setMimeTypes('application/json');
    if (missing.length === 1) view.setQuery(missing[0].file);
    new google.picker.PickerBuilder().addView(view).enableFeature(google.picker.Feature.MULTISELECT_ENABLED).setTitle('Pick: ' + missing.map(m => m.file).join(', '))
      .setOAuthToken(accessToken).setDeveloperKey(PICKER_API_KEY).setAppId(GCP_APP_ID)
      .setCallback(d => {
        if (d.action !== google.picker.Action.PICKED) return;
        const map = ids();
        d.docs.forEach(doc => { const s = SOURCES.find(x => x.file === doc.name); if (s) map[s.app] = doc.id; });
        LS.set('lp-ids', JSON.stringify(map)); refresh(true);
      }).build().setVisible(true);
  });
}
